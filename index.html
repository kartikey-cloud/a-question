<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Question For You 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f2;
    --bg2:#fdf1ee;
    --ink:#3d3431;
    --ink-soft:#8a7d77;
    --blush:#e8a4b8;
    --blush-deep:#d4748f;
    --blush-soft:#f6dde4;
    --cream:#fffdfb;
    --gold:#d9b98c;
    --shadow:0 18px 50px -12px rgba(180,120,135,.25);
    --radius:26px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Karla',sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,#f7ece9 100%);
    overflow:hidden;
    position:relative;
  }
  /* ---------- floating hearts background ---------- */
  .floaties{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .floaty{
    position:absolute;bottom:-8vh;
    font-size:18px;opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}
    8%{opacity:.5}
    90%{opacity:.25}
    100%{transform:translateY(-115vh) translateX(var(--drift,30px)) rotate(25deg);opacity:0}
  }
  /* ---------- layout ---------- */
  .stage{
    position:relative;z-index:1;
    height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;
  }
  .step{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    opacity:0;pointer-events:none;
    transform:translateY(26px) scale(.985);
    transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1);
  }
  .step.active{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
  .step.leaving{opacity:0;transform:translateY(-26px) scale(.985)}
  h1{
    font-family:'Fraunces',serif;font-weight:520;
    font-size:clamp(1.9rem,5.4vw,3.2rem);
    letter-spacing:-.01em;line-height:1.15;
    margin-bottom:.4em;
  }
  .sub{color:var(--ink-soft);font-size:clamp(.95rem,2.4vw,1.08rem);margin-bottom:2.2em}
  .icon-top{font-size:2.2rem;margin-bottom:18px;display:inline-block;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

  /* ---------- progress dots ---------- */
  .dots{
    position:fixed;top:26px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;z-index:5;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#e5d4d0;transition:all .4s}
  .dot.on{background:var(--blush-deep);transform:scale(1.25)}

  /* ---------- step 1 : the question ---------- */
  .btn-row{display:flex;gap:22px;align-items:center;justify-content:center;min-height:90px}
  .btn{
    font-family:'Karla',sans-serif;font-weight:600;font-size:1.05rem;
    padding:16px 44px;border-radius:999px;border:none;cursor:pointer;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;
  }
  #yesBtn{
    background:linear-gradient(135deg,var(--blush) 0%,var(--blush-deep) 100%);
    color:#fff;box-shadow:0 10px 28px -8px rgba(212,116,143,.55);
  }
  #yesBtn:hover{transform:scale(1.07);box-shadow:0 14px 34px -8px rgba(212,116,143,.7)}
  #noBtn{
    background:var(--cream);color:var(--ink-soft);
    border:1.5px solid #eadcd6;box-shadow:0 6px 18px -8px rgba(0,0,0,.08);
    position:fixed; /* set via JS so it can flee anywhere */
    z-index:6;
  }
  .taunt{
    margin-top:26px;height:1.4em;color:var(--blush-deep);
    font-size:.95rem;font-style:italic;opacity:0;transition:opacity .3s;
  }
  .taunt.show{opacity:1}

  /* ---------- step 2 : calendar ---------- */
  .cal{
    background:var(--cream);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px 24px 26px;width:min(340px,92vw);
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-head span{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:560}
  .cal-nav{
    background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--ink-soft);
    width:34px;height:34px;border-radius:50%;transition:background .2s;
  }
  .cal-nav:hover{background:var(--blush-soft)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{font-size:.7rem;font-weight:600;color:var(--ink-soft);padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
  .day{
    aspect-ratio:1;border:none;background:none;border-radius:50%;
    font-family:'Karla',sans-serif;font-size:.92rem;color:var(--ink);
    cursor:pointer;transition:all .18s;
  }
  .day:hover:not(:disabled){background:var(--blush-soft);transform:scale(1.1)}
  .day:disabled{color:#d8cdc8;cursor:default}
  .day.other{color:#d8cdc8}
  .day.sel{
    background:linear-gradient(135deg,var(--blush),var(--blush-deep));
    color:#fff;transform:scale(1.12);
    box-shadow:0 6px 16px -4px rgba(212,116,143,.6);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1.12)}}

  /* ---------- step 3 : time ---------- */
  .time-list{display:flex;flex-direction:column;gap:14px;width:min(460px,92vw)}
  .time-opt{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--cream);border:1.5px solid transparent;border-radius:20px;
    padding:20px 26px;cursor:pointer;box-shadow:0 8px 24px -12px rgba(180,120,135,.2);
    transition:all .25s cubic-bezier(.34,1.56,.64,1);text-align:left;
  }
  .time-opt:hover{transform:translateX(8px) scale(1.015);border-color:var(--blush);box-shadow:var(--shadow)}
  .time-opt .t-name{font-family:'Fraunces',serif;font-size:1.18rem;font-weight:540}
  .time-opt .t-emoji{margin-right:12px;font-size:1.3rem;display:inline-block;transition:transform .3s}
  .time-opt:hover .t-emoji{transform:rotate(-12deg) scale(1.25)}
  .time-opt .t-time{color:var(--blush-deep);font-weight:600;font-size:.95rem;white-space:nowrap;margin-left:16px}

  /* ---------- step 4 : food ---------- */
  .food-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:16px;width:min(620px,92vw);
  }
  .food{
    background:var(--cream);border-radius:24px;border:1.5px solid transparent;
    padding:28px 12px 22px;cursor:pointer;
    box-shadow:0 8px 24px -12px rgba(180,120,135,.2);
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .food .f-emoji{font-size:2.8rem;display:inline-block;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .food .f-name{font-family:'Fraunces',serif;font-size:1.05rem;margin-top:12px;font-weight:540}
  .food .f-tag{font-size:.74rem;color:var(--ink-soft);margin-top:3px}
  .food:hover{transform:translateY(-8px);border-color:var(--blush);box-shadow:var(--shadow)}
  .food:hover .f-emoji{transform:scale(1.3) rotate(8deg)}
  .food:nth-child(2):hover .f-emoji{transform:scale(1.3) rotate(-8deg)}
  .food.picked .f-emoji{animation:gobble .5s ease}
  @keyframes gobble{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(-15deg)}100%{transform:scale(1.2)}}

  /* ---------- step 5 : confirmation ---------- */
  .sparkle{font-size:2.6rem;display:inline-block;margin-bottom:10px;animation:spin-pop 1s cubic-bezier(.34,1.56,.64,1)}
  @keyframes spin-pop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .ticket{
    background:var(--cream);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:34px 44px;width:min(420px,92vw);margin-top:8px;
    position:relative;
  }
  .ticket::before,.ticket::after{
    content:"";position:absolute;width:26px;height:26px;border-radius:50%;
    background:var(--bg2);top:50%;transform:translateY(-50%);
  }
  .ticket::before{left:-13px}
  .ticket::after{right:-13px}
  .t-label{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .t-value{font-family:'Fraunces',serif;font-size:1.45rem;font-weight:540;margin-top:4px}
  .t-accent{color:var(--blush-deep);font-size:1.05rem;font-weight:600;margin-top:2px;font-family:'Karla',sans-serif}
  .t-div{height:1px;background:repeating-linear-gradient(90deg,#e9dad5 0 6px,transparent 6px 12px);margin:20px 0}
  .hint{margin-top:26px;color:var(--ink-soft);font-size:.88rem}
  .startover{
    margin-top:14px;background:none;border:none;color:var(--ink-soft);
    font-family:'Karla',sans-serif;font-size:.85rem;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;
  }
  .startover:hover{color:var(--blush-deep)}

  /* ---------- confetti hearts ---------- */
  .confetto{position:fixed;z-index:9;pointer-events:none;will-change:transform,opacity}

  /* burst particles on food click */
  .burst{position:fixed;z-index:9;pointer-events:none;font-size:1.2rem;will-change:transform,opacity}

  @media (max-width:540px){
    .btn{padding:14px 36px}
    .ticket{padding:28px 30px}
    .food-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<div class="floaties" id="floaties"></div>
<div class="dots" id="dots"></div>

<div class="stage">

  <!-- STEP 1 : the big question -->
  <section class="step active" id="step-ask">
    <span class="icon-top">🤍</span>
    <h1>Will you go on a date<br>with me?</h1>
    <p class="sub">(choose wisely)</p>
    <div class="btn-row">
      <button class="btn" id="yesBtn">Yes!</button>
    </div>
    <button class="btn" id="noBtn">No</button>
    <p class="taunt" id="taunt"></p>
  </section>

  <!-- STEP 2 : calendar -->
  <section class="step" id="step-when">
    <h1>When are you free?</h1>
    <p class="sub">pick a day, any day (that works for you)</p>
    <div class="cal">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev">‹</button>
        <span id="calTitle"></span>
        <button class="cal-nav" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </section>

  <!-- STEP 3 : time -->
  <section class="step" id="step-time">
    <h1>What time?</h1>
    <p class="sub">when does the magic happen</p>
    <div class="time-list" id="timeList"></div>
  </section>

  <!-- STEP 4 : food -->
  <section class="step" id="step-food">
    <h1>What are we feeling?</h1>
    <p class="sub">hover around… they're a little shy</p>
    <div class="food-grid" id="foodGrid"></div>
  </section>

  <!-- STEP 5 : confirmation -->
  <section class="step" id="step-done">
    <span class="sparkle">✨</span>
    <h1>It's a date!</h1>
    <div class="ticket">
      <div class="t-label">When</div>
      <div class="t-value" id="outDate">—</div>
      <div class="t-accent" id="outTime">—</div>
      <div class="t-div"></div>
      <div class="t-label">What</div>
      <div class="t-value" id="outFood">—</div>
    </div>
    <p class="hint">screenshot this &amp; send it back to me 💌</p>
    <button class="startover" id="startOver">start over</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ================= state ================= */
  const state = { date:null, time:null, food:null };
  const steps = ["step-ask","step-when","step-time","step-food","step-done"];
  let current = 0;

  /* ================= progress dots ================= */
  const dotsEl = document.getElementById("dots");
  steps.forEach(()=>{ const d=document.createElement("div"); d.className="dot"; dotsEl.appendChild(d); });
  function paintDots(){ [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on", i===current)); }
  paintDots();

  /* ================= step transitions ================= */
  function goTo(i){
    const from = document.getElementById(steps[current]);
    const to   = document.getElementById(steps[i]);
    from.classList.add("leaving"); from.classList.remove("active");
    setTimeout(()=>{
      from.classList.remove("leaving");
      to.classList.add("active");
      current = i; paintDots();
    }, 380);
  }

  /* ================= floating hearts bg ================= */
  const floaties = document.getElementById("floaties");
  const symbols = ["🤍","🩷","✨","💗","🌸"];
  for(let i=0;i<16;i++){
    const f=document.createElement("span");
    f.className="floaty";
    f.textContent=symbols[i%symbols.length];
    f.style.left = Math.random()*100+"vw";
    f.style.setProperty("--drift",(Math.random()*120-60)+"px");
    f.style.animationDuration = (9+Math.random()*10)+"s";
    f.style.animationDelay = (Math.random()*12)+"s";
    f.style.fontSize = (12+Math.random()*14)+"px";
    floaties.appendChild(f);
  }

  /* ================= STEP 1 : runaway "No" ================= */
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const taunt = document.getElementById("taunt");
  const taunts = [
    "nope, not an option 😌",
    "the button is faster than you",
    "you can't catch feelings OR this button",
    "it's literally running from commitment",
    "just say yes, it's easier",
    "the universe says yes",
    "ok now you're just playing hard to get",
  ];
  let dodges = 0;

  // place "No" initially next to "Yes"
  function dockNo(){
    const r = yesBtn.getBoundingClientRect();
    noBtn.style.left = (r.right + 22) + "px";
    noBtn.style.top  = r.top + "px";
  }
  window.addEventListener("load", dockNo);
  window.addEventListener("resize", ()=>{ if(dodges===0) dockNo(); });
  setTimeout(dockNo, 50);

  function flee(){
    dodges++;
    const pad = 80;
    const w = window.innerWidth, h = window.innerHeight;
    const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
    let x, y, tries = 0;
    const yr = yesBtn.getBoundingClientRect();
    do{
      x = pad + Math.random()*(w - bw - pad*2);
      y = pad + Math.random()*(h - bh - pad*2);
      tries++;
    } while(tries < 20 && Math.abs(x - yr.left) < 180 && Math.abs(y - yr.top) < 120);
    noBtn.style.transition = "left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1), transform .25s";
    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";
    // yes grows a touch, no shrinks a touch
    const grow = Math.min(1 + dodges*0.06, 1.45);
    const shrink = Math.max(1 - dodges*0.05, 0.6);
    yesBtn.style.transform = `scale(${grow})`;
    noBtn.style.transform = `scale(${shrink})`;
    taunt.textContent = taunts[Math.min(dodges-1, taunts.length-1)];
    taunt.classList.add("show");
  }

  // flee when pointer gets near
  document.addEventListener("mousemove", (e)=>{
    if(current!==0) return;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if(dist < 90) flee();
  });
  // touch devices: jump on touch attempt
  noBtn.addEventListener("touchstart",(e)=>{ e.preventDefault(); flee(); },{passive:false});
  noBtn.addEventListener("click",(e)=>{ e.preventDefault(); flee(); });

  yesBtn.addEventListener("click", ()=>{
    noBtn.style.display="none";
    heartBurst(yesBtn);
    setTimeout(()=>goTo(1), 450);
  });

  /* ================= STEP 2 : calendar ================= */
  const calTitle = document.getElementById("calTitle");
  const calGrid  = document.getElementById("calGrid");
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const dows = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  const today = new Date(); today.setHours(0,0,0,0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);

  function renderCal(){
    calTitle.textContent = months[view.getMonth()] + " " + view.getFullYear();
    calGrid.innerHTML = "";
    dows.forEach(d=>{ const s=document.createElement("div"); s.className="dow"; s.textContent=d; calGrid.appendChild(s); });
    const firstDow = view.getDay();
    const start = new Date(view); start.setDate(1 - firstDow);
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const b = document.createElement("button");
      b.className = "day";
      b.textContent = d.getDate();
      const inMonth = d.getMonth()===view.getMonth();
      if(!inMonth) b.classList.add("other");
      if(d < today) b.disabled = true;
      if(state.date && d.getTime()===state.date.getTime()) b.classList.add("sel");
      b.addEventListener("click", ()=>{
        if(b.disabled) return;
        state.date = d;
        renderCal();
        setTimeout(()=>goTo(2), 550);
      });
      calGrid.appendChild(b);
    }
  }
  document.getElementById("calPrev").addEventListener("click", ()=>{
    view = new Date(view.getFullYear(), view.getMonth()-1, 1);
    const thisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    if(view < thisMonth) view = thisMonth;
    renderCal();
  });
  document.getElementById("calNext").addEventListener("click", ()=>{
    view = new Date(view.getFullYear(), view.getMonth()+1, 1);
    renderCal();
  });
  renderCal();

  /* ================= STEP 3 : time ================= */
  const timeOpts = [
    {emoji:"🥞", name:"Brunch",     time:"11:30 AM"},
    {emoji:"🌇", name:"Evening",    time:"7:00 PM"},
    {emoji:"🌙", name:"Night",      time:"8:30 PM"},
    {emoji:"🌌", name:"Late Night", time:"10:00 PM"},
  ];
  const timeList = document.getElementById("timeList");
  timeOpts.forEach(t=>{
    const b = document.createElement("button");
    b.className = "time-opt";
    b.innerHTML = `<span class="t-name"><span class="t-emoji">${t.emoji}</span>${t.name}</span><span class="t-time">${t.time}</span>`;
    b.addEventListener("click", ()=>{
      state.time = t;
      heartBurst(b);
      setTimeout(()=>goTo(3), 400);
    });
    timeList.appendChild(b);
  });

  /* ================= STEP 4 : food ================= */
  const foods = [
    {emoji:"🍣", name:"Sushi", tag:"fancy & fresh"},
    {emoji:"🍝", name:"Pasta", tag:"lady & the tramp style"},
    {emoji:"🍕", name:"Pizza", tag:"a classic for a reason"},
    {emoji:"🍰", name:"Dessert First", tag:"life is short"},
  ];
  const foodGrid = document.getElementById("foodGrid");
  foods.forEach(f=>{
    const b = document.createElement("button");
    b.className = "food";
    b.innerHTML = `<span class="f-emoji">${f.emoji}</span><div class="f-name">${f.name}</div><div class="f-tag">${f.tag}</div>`;
    b.addEventListener("click", ()=>{
      b.classList.add("picked");
      state.food = f;
      emojiBurst(b, f.emoji);
      setTimeout(()=>{ fillTicket(); goTo(4); confettiRain(); }, 600);
    });
    foodGrid.appendChild(b);
  });

  /* ================= STEP 5 : confirmation ================= */
  function ordinal(n){
    if(n%100>=11 && n%100<=13) return n+"th";
    return n + ({1:"st",2:"nd",3:"rd"}[n%10] || "th");
  }
  const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function fillTicket(){
    const d = state.date;
    document.getElementById("outDate").textContent =
      `${dayNames[d.getDay()]}, ${months[d.getMonth()]} ${ordinal(d.getDate())}`;
    document.getElementById("outTime").textContent = `${state.time.emoji} ${state.time.name} · ${state.time.time}`;
    document.getElementById("outFood").textContent = `${state.food.emoji} ${state.food.name}`;
  }
  document.getElementById("startOver").addEventListener("click", ()=>{
    state.date = state.time = state.food = null;
    dodges = 0;
    yesBtn.style.transform = "";
    noBtn.style.transform = "";
    noBtn.style.display = "";
    taunt.classList.remove("show");
    document.querySelectorAll(".food").forEach(f=>f.classList.remove("picked"));
    renderCal();
    goTo(0);
    setTimeout(dockNo, 500);
  });

  /* ================= effects ================= */
  function heartBurst(el){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    for(let i=0;i<10;i++){
      spawnParticle("🩷", cx, cy, 1.5 + Math.random());
    }
  }
  function emojiBurst(el, emoji){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    for(let i=0;i<12;i++){
      spawnParticle(i%3===0 ? "✨" : emoji, cx, cy, 1.5 + Math.random());
    }
  }
  function spawnParticle(txt, x, y, dur){
    const p = document.createElement("span");
    p.className = "burst";
    p.textContent = txt;
    p.style.left = x+"px"; p.style.top = y+"px";
    document.body.appendChild(p);
    const ang = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*120;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 40;
    p.animate([
      {transform:"translate(-50%,-50%) scale(.6) rotate(0deg)", opacity:1},
      {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.3) rotate(${Math.random()*180-90}deg)`, opacity:0}
    ],{duration:dur*700, easing:"cubic-bezier(.22,1,.36,1)"}).onfinish = ()=>p.remove();
  }
  function confettiRain(){
    const pieces = ["🩷","🤍","✨","🌸","💗"];
    for(let i=0;i<36;i++){
      setTimeout(()=>{
        const c = document.createElement("span");
        c.className = "confetto";
        c.textContent = pieces[Math.floor(Math.random()*pieces.length)];
        const x = Math.random()*window.innerWidth;
        c.style.left = x+"px"; c.style.top = "-40px";
        c.style.fontSize = (14+Math.random()*16)+"px";
        document.body.appendChild(c);
        c.animate([
          {transform:"translateY(0) rotate(0deg)", opacity:1},
          {transform:`translateY(${window.innerHeight+80}px) rotate(${Math.random()*360-180}deg)`, opacity:.7}
        ],{duration:2600+Math.random()*2200, easing:"cubic-bezier(.3,.6,.6,1)"}).onfinish = ()=>c.remove();
      }, i*70);
    }
  }
})();
</script>
